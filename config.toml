# Game and runtime settings. Amounts are in dollars.

[game]
small_blind = 1.00
big_blind = 2.00
max_players = 7
buy_in = 1000.00         # default stack in the UI (500 big blinds)
# chip_increment = 1.00  # optional; smallest chip for bet sizes (defaults to the small blind)

[llm]
base_url = "http://localhost:11434"
model = "qwen3:30b-a3b"
temperature = 0.2
timeout_seconds = 60
max_retries = 1
max_tokens = 600           # output cap per reply (thinking models need more, e.g. 4000)
think = false              # let thinking models reason first (slower, ~+10s)
constrain_actions = true   # restrict the schema's action enum to legal moves
prompt_version = "v2"

[equity]
iterations = 20000
seed = 0                # 0 = random; set nonzero for reproducible runs

[storage]
db_path = "poker_agent.db"
