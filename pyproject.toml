[project]
name = "poker-agent"
version = "0.1.0"
description = "Local-LLM Texas Hold'em decision aid with deterministic poker math"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "phevaluator>=0.6.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
poker-agent = "poker_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
